- table:
    schema: public
    name: organizations
  object_relationships: []
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - name
          - slug
          - quota_limit
          - quota_used
          - quota_period_start
          - created_at
          - updated_at
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - slug
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
        check: null

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - user_id
          - role
          - created_at
          - updated_at
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - org_id
          - user_id
          - role
        check:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
  update_permissions:
    - role: user
      permission:
        columns:
          - role
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: workflow_steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: workflow_triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - org_id
          - name
          - description
          - is_active
          - created_by
        check:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
        set:
          created_by: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - description
          - is_active
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner

- table:
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_step_id
          table:
            schema: public
            name: step_runs
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - workflow_id
          - step_order
          - step_type
          - name
          - config
        check:
          _or:
            - _and:
                - workflow:
                    organization:
                      org_members:
                        user_id:
                          _eq: X-Hasura-User-Id
                        role:
                          _eq: editor
                - step_type:
                    _nin:
                      - db_write
                      - notify
            - workflow:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
                    role:
                      _eq: owner
  update_permissions:
    - role: user
      permission:
        columns:
          - step_order
          - step_type
          - name
          - config
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in:
                    - owner
                    - editor
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in:
                    - owner
                    - editor

- table:
    schema: public
    name: workflow_triggers
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - workflow_id
          - trigger_type
          - config
          - is_active
