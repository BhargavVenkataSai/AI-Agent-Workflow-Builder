                    _neq: webhook
            - workflow:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
                    role:
                      _eq: owner
  update_permissions:
    - role: user
      permission:
        columns:
          - trigger_type
          - config
          - is_active
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in:
                    - owner
                    - editor
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in:
                    - owner
                    - editor

