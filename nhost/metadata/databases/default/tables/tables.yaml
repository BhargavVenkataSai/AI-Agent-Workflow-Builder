      permission:
        columns:
          - workflow_run_id
          - workflow_step_id
          - status
          - started_at
          - input
          - attempt_count
        check:
          workflow_run:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in:
                    - owner
                    - editor
  update_permissions:
    - role: user
      permission:
        columns:
          - status
          - started_at
          - completed_at
          - output
          - error
          - attempt_count
          - approved_by
          - approved_at
        filter:
          workflow_run:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
